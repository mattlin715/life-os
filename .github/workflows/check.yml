name: Check

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm run test:run

      - name: AI workflow contract tests
        run: pnpm run test:workflow

      - name: AI workflow state validation
        run: pnpm run verify:workflow

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  rust:
    name: Rust Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev

      - name: SQLite persistence tests
        run: cargo test --manifest-path src-tauri/Cargo.toml sqlite::tests -- --nocapture

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
